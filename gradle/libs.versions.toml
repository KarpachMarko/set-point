[versions]
agp = "8.10.1"
kotlin = "2.2.10"
compose = "2025.08.00"
wearCompose = "1.5.0"
activity = "1.10.1"
lifecycle = "2.9.2"
junit = "4.13.2"
wear = "1.3.0"
wearOngoing = "1.1.0"
core = "1.15.0"
testRunner = "1.6.2"
testJunit = "1.2.1"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
wear-compose-material3 = { module = "androidx.wear.compose:compose-material3", version.ref = "wearCompose" }
wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wearCompose" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
junit = { module = "junit:junit", version.ref = "junit" }
wear-ambient = { module = "androidx.wear:wear", version.ref = "wear" }
wear-ongoing = { module = "androidx.wear:wear-ongoing", version.ref = "wearOngoing" }
androidx-core = { module = "androidx.core:core", version.ref = "core" }
test-runner = { module = "androidx.test:runner", version.ref = "testRunner" }
test-junit = { module = "androidx.test.ext:junit", version.ref = "testJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
